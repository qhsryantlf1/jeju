services:
  - type: web
    name: jeju-tv-bulletin
    runtime: python
    plan: free
    buildCommand: npm install && npm run build && pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k gthread --threads 4 -b 0.0.0.0:$PORT server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GOOGLE_SHEET_TAB
        value: 6월
      - key: SHEET_CACHE_TTL
        value: "300"
